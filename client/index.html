<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cuadrilo</title>
  </head>
  <body>
    <div id="root"><noscript>__NOSCRIPT_MESSAGE__</noscript></div>
    <!--
      Plain old JavaScript on purpose: it must run in a browser that cannot run the app below. A browser too old
      for the app's code fails to even parse it and leaves a white page, so this asks the browser what it is
      (engine, version, system) and, below the build target (README "Supported browsers"), tells the person why.
      An unknown browser gets no notice. The app replaces the notice if it starts after all.
    -->
    <script>
      // biome-ignore lint/complexity/useArrowFunction: this script must stay old JavaScript (no arrows).
      (function () {
        var message = __BROWSER_MESSAGE__;
        var ua = navigator.userAgent || '';
        // The first rule whose pattern matches decides: [name shown, pattern (major, minor), minimum major, minor].
        var rules = [
          // On iPhone and iPad every browser (Chrome and Firefox too) runs on Safari's engine, which comes with iOS.
          ['iOS', /(?:iPhone|iPad|iPod).*? OS (\d+)(?:_(\d+))?/, 16, 4],
          ['Internet Explorer', /Trident\/|MSIE /, 1, 0],
          ['Firefox', /Firefox\/(\d+)/, 114, 0],
          // Chrome, Edge, Opera, Samsung Internet, Yandex and Android's WebView all name their Chromium version.
          ['Chrome', /(?:Chrome|Chromium)\/(\d+)/, 111, 0],
          ['Safari', /Version\/(\d+)(?:\.(\d+))?.*Safari\//, 16, 4],
        ];
        var rule = null;
        var match = null;
        var i;
        for (i = 0; i < rules.length && !match; i++) {
          rule = rules[i];
          match = rule[1].exec(ua);
        }
        // An unknown browser gets no notice.
        if (!match) return;
        var major = +(match[1] || 0);
        var minor = +(match[2] || 0);
        if (major > rule[2] || (major === rule[2] && minor >= rule[3])) return;
        var root = document.getElementById('root');
        if (!root) return;
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'max-width:34rem;margin:15vh auto 0;padding:0 1.5rem;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#222';
        var title = document.createElement('h1');
        title.style.cssText = 'font-size:1.4rem;margin:0 0 .75rem';
        title.appendChild(document.createTextNode(message.title));
        var text = document.createElement('p');
        text.style.margin = '0 0 .75rem';
        text.appendChild(document.createTextNode(rule[0] === 'iOS' ? message.textIos : message.text));
        var yours = document.createElement('p');
        yours.style.cssText = 'margin:0;color:#666;font-size:.9rem';
        var name = major ? [rule[0], minor ? [major, minor].join('.') : major].join(' ') : rule[0];
        yours.appendChild(document.createTextNode(message.yours.replace('{browser}', name)));
        box.appendChild(title);
        box.appendChild(text);
        box.appendChild(yours);
        root.appendChild(box);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
