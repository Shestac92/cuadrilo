name: Desktop app

# Packs Cuadrilo Demo App (docs/desktop.md) for macOS (Apple silicon, Intel) and Windows (x64), each on its own
# system, and starts every package once (--smoke-test).
# - A release tag v<version> (the version of the root package.json): the packages are attached to the GitHub
#   release of the tag (made if there is none yet); the landing page downloads them from there.
# - By hand (Actions → Desktop app → Run workflow, or `gh workflow run desktop.yml --ref <branch>`): a trial; the
#   packages are only the run's artifacts, no release. GitHub offers it once this file is on the default branch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-latest
            target: mac
            arch: arm64
            app: desktop/dist/release/mac-arm64/Cuadrilo Demo App.app/Contents/MacOS/Cuadrilo Demo App
          - name: macOS Intel
            runner: macos-15-intel
            target: mac
            arch: x64
            app: desktop/dist/release/mac/Cuadrilo Demo App.app/Contents/MacOS/Cuadrilo Demo App
          - name: Windows x64
            runner: windows-latest
            target: win
            arch: x64
            app: desktop/dist/release/win-unpacked/Cuadrilo Demo App.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, package.json says $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build -w desktop
      - run: npm run package -w desktop -- ${{ matrix.target }} ${{ matrix.arch }}
      - name: Smoke test
        run: '"${{ matrix.app }}" --smoke-test'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop/dist/release/*.dmg
            desktop/dist/release/*.exe
          if-no-files-found: error
          # Packed already.
          compression-level: 0
          # A trial's packages are not kept long; a release's are in the release.
          retention-days: 14

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      # The release may be made by hand (with its own notes) before or while the packages are built: then they
      # are only added to it (a file of the same name replaced). Otherwise it is made here, with the install notes.
      - name: Attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            cat > notes.md <<'EOF'
          ## Cuadrilo Demo App

          The platform with a demo class on your own computer: the teacher and a student side by side.

          - **macOS**: the `.dmg` for your Mac (`arm64` for Apple silicon, `x64` for Intel). The app is not signed by Apple: the first time, open it, then System Settings → Privacy & Security → Open Anyway.
          - **Windows**: `setup.exe` installs it for you (no administrator), `portable.exe` runs without installing. Windows SmartScreen may warn about an unknown app: More info → Run anyway.
          EOF
            gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
